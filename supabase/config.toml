# Supabase CLI yapılandırması (yerel geliştirme + deploy).
# Kurulum: brew install supabase/tap/supabase  ·  supabase link --project-ref <ref>
project_id = "fraktal"

[api]
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "fraktal://auth-callback"
additional_redirect_urls = ["fraktal://auth-callback"]
enable_anonymous_sign_ins = true
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

[auth.external.apple]
enabled = true
client_id = "com.fraktal"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = true

[functions.send-alerts]
# Kullanıcı JWT'si değil, service_role ile çağrılır (pipelines/ingest --notify).
verify_jwt = false

[functions.ai-analyze]
verify_jwt = true
